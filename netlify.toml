[build]
  # Leave empty because package.json is in the root
  base = "" 

  # Only build the client since you don't have the server folder uploaded
  command = "npm run build:client"

  # This must match the folder name that appeared locally
  publish = "dist"

# This section is CRITICAL for React/Vite apps
[[redirects]]
  from = "/api/*"
  to = "https://topxcm-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200