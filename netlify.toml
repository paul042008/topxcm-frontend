[build]
  # Tell Netlify the package.json and code are in the root
  base = "" 

  # ONLY build the client, ignore the server folder
  command = "pnpm run build:client"

  # Direct Netlify to the folder Vite creates (likely client/dist or dist)
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://topxcm-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200